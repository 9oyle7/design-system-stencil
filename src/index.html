<!DOCTYPE html>
<html dir="ltr" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0" />
    <title>Stencil Component Starter</title>
    <link rel="stylesheet" href="/build/design-system-stencil.css" />
    <script type="module" src="/build/design-system-stencil.esm.js"></script>
    <script nomodule src="/build/design-system-stencil.js"></script>
  </head>
  <body>
    <theme-switcher></theme-switcher>

    <for-testing></for-testing>
    <div>
      <ds-icon icon-name="coffee" icon-size="xs" color="primary"></ds-icon>
      <ds-icon icon-name="coffee" icon-size="xs" color="secondary"></ds-icon>
      <ds-icon icon-name="coffee" icon-size="xs" color="success"></ds-icon>
      <ds-icon icon-name="coffee" icon-size="xs" color="danger"></ds-icon>
      <ds-icon icon-name="coffee" icon-size="xs" color="warning"></ds-icon>

      <ds-icon icon-name="coffee" icon-size="sm" color="primary"></ds-icon>
      <ds-icon icon-name="coffee" icon-size="sm" color="secondary"></ds-icon>
      <ds-icon icon-name="coffee" icon-size="sm" color="success"></ds-icon>
      <ds-icon icon-name="coffee" icon-size="sm" color="danger"></ds-icon>
      <ds-icon icon-name="coffee" icon-size="sm" color="warning"></ds-icon>

      <ds-icon icon-name="coffee" icon-size="md" color="primary"></ds-icon>
      <ds-icon icon-name="coffee" icon-size="md" color="secondary"></ds-icon>
      <ds-icon icon-name="coffee" icon-size="md" color="success"></ds-icon>
      <ds-icon icon-name="coffee" icon-size="md" color="danger"></ds-icon>
      <ds-icon icon-name="coffee" icon-size="md" color="warning"></ds-icon>

      <ds-icon icon-name="coffee" icon-size="lg" color="primary"></ds-icon>
      <ds-icon icon-name="coffee" icon-size="lg" color="secondary"></ds-icon>
      <ds-icon icon-name="coffee" icon-size="lg" color="success"></ds-icon>
      <ds-icon icon-name="coffee" icon-size="lg" color="danger"></ds-icon>
      <ds-icon icon-name="coffee" icon-size="lg" color="warning"></ds-icon>
    </div>

    <h1>
      butttons
    </h1>
<!-- زر ناعم -->
<ds-button  radius="none" >primary</ds-button>
<ds-button color="success" variant="soft" size="md">إضافة</ds-button>

<!-- زر كرابط -->
<ds-button color="secondary" variant="link" size="md">عرض الكل</ds-button>

<!-- زر رئيسي -->
<ds-button color="success" variant="solid" size="lg">تأكيد</ds-button>


  </body>
</html>
